[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collectohub-api"
version = "0.1.0"
description = "CollectorHub backend API"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "authlib>=1.3",
    "httpx>=0.27",                   # OAuth HTTP client
    # Config
    "pydantic-settings>=2.3",
    # Media
    "boto3>=1.34",                   # S3-compat for R2
    "pillow>=10.4",                  # pHash / watermark
    "imagehash>=4.3",
    # Validation / utils
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    "pydantic[email]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "coverage>=7.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
