# T-02 — CI gate (LAUNCH_PLAN §6): typecheck + tests + build on every PR and push
# to main. Deploys stay with Vercel (frontend) / Render (backend) auto-deploy on
# main — this workflow is the quality gate in front of them, not the deployer.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collectohub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      # T-01 integration harness (tests/conftest.py) — points at the service container.
      # Absent this var, integration tests SKIP; here they run against real Postgres.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/collectohub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Import check
        run: python -c "import app.main"
      - name: Tests (unit + integration)
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (informational — 13 pre-existing react-hooks errors to burn down before making this a hard gate)
        run: npx eslint src
        continue-on-error: true
      - name: Build
        run: npm run build
