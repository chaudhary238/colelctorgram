<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline · Scorred</title>
<style>
  :root { --paper:#FFFFFF; --ink:#1A1A1A; --ink-faint:#8A8F98; --stamp-red:#FF2442; --border:#EAECEF; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 18px;
    padding: calc(24px + env(safe-area-inset-top)) 28px calc(24px + env(safe-area-inset-bottom));
  }
  img { width: 72px; height: 72px; }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  p { font-size: 15px; line-height: 1.55; color: var(--ink-faint); margin: 0; max-width: 320px; }
  button {
    margin-top: 6px; border: none; cursor: pointer;
    background: var(--stamp-red); color: #fff;
    font-size: 15px; font-weight: 600; padding: 12px 22px; border-radius: 999px;
  }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <img src="/icon-192.png" alt="Scorred" />
  <h1>You're offline</h1>
  <p>We couldn't reach Scorred. Check your connection and try again — your collection is safe.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
