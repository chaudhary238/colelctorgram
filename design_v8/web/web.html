<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Web App · CollectorHub (Instagram-style)" subtitle="Desktop web build — left sidebar IA, centered feed column, right rail" viewport="1440x900" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CollectorHub · Web</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script>window.CH_WEB = true;</script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bone);
    font-family: var(--font-body); color: var(--ink); }
  #web-mount { min-height: 100vh; }

  /* keyframes reused by the shared screens/overlays */
  @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes pop { 0% { transform: translateX(-50%) scale(0.7); opacity: 0; } 60% { transform: translateX(-50%) scale(1.06); opacity: 1; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }

  /* thin scrollbars inside the feed column */
  .ch-col ::-webkit-scrollbar { width: 8px; height: 8px; }
  .ch-col ::-webkit-scrollbar-thumb { background: var(--bone-deep); border-radius: 8px; }
  .ch-col ::-webkit-scrollbar-track { background: transparent; }

  /* ── responsive sidebar (Instagram collapses labels) ── */
  .ch-sidebar { width: 245px; }
  @media (max-width: 1280px) {
    .ch-sidebar { width: 84px !important; align-items: center; padding-left: 10px; padding-right: 10px; }
    .ch-nav-label { display: none !important; }
    .ch-nav { justify-content: center !important; }
    .ch-sidebar > button:first-child { justify-content: center; }
  }
  /* ── right rail only on wide viewports ── */
  @media (max-width: 1240px) { .ch-rail { display: none !important; } }
  /* ── cap the column on smaller screens (overrides JS width) ── */
  @media (max-width: 1100px) {
    .ch-col { width: min(100%, 680px) !important; }
    .ch-content { gap: 0 !important; }
  }
  /* ── narrow fallback: column fills, slim sidebar ── */
  @media (max-width: 620px) {
    .ch-sidebar { width: 66px !important; }
    .ch-col { width: 100% !important; border-right: none !important; }
  }
</style>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#b3402e"/>
    <rect x="30" y="30" width="40" height="40" rx="9" fill="none" stroke="#f7f1e6" stroke-width="5"/>
    <circle cx="50" cy="50" r="9" fill="none" stroke="#f7f1e6" stroke-width="5"/>
    <circle cx="63" cy="37" r="3" fill="#f7f1e6"/>
  </svg>
</template>
<div id="web-mount"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Shared app sources are single-sourced from ../app (the canonical copies);
     only the web shell (Web.jsx) lives here. This keeps the design-system
     compiler free of duplicate component names while keeping web-specific
     code in /web. -->

<!-- primitives + data -->
<script type="text/babel" src="../app/shared.jsx"></script>
<script type="text/babel" src="../app/data.jsx"></script>

<!-- chrome + nav -->
<script type="text/babel" src="../app/Nav.jsx"></script>
<script type="text/babel" src="../app/Chrome.jsx"></script>
<script type="text/babel" src="../app/Cards.jsx"></script>

<!-- root tab views -->
<script type="text/babel" src="../app/FeedView.jsx"></script>
<script type="text/babel" src="../app/MarketView.jsx"></script>
<script type="text/babel" src="../app/CommunityView.jsx"></script>
<script type="text/babel" src="../app/EventsView.jsx"></script>
<script type="text/babel" src="../app/ProfileView.jsx"></script>

<!-- detail screens -->
<script type="text/babel" src="../app/ListingView.jsx"></script>
<script type="text/babel" src="../app/PostDetail.jsx"></script>
<script type="text/babel" src="../app/ItemDetail.jsx"></script>
<script type="text/babel" src="../app/AddToCollection.jsx"></script>
<script type="text/babel" src="../app/CommunityDetail.jsx"></script>
<script type="text/babel" src="../app/EventDetail.jsx"></script>
<script type="text/babel" src="../app/Chat.jsx"></script>

<!-- overlays -->
<script type="text/babel" src="../app/Overlays.jsx"></script>

<!-- web shell + boot (web-only) -->
<script type="text/babel" src="Web.jsx"></script>
</body>
</html>
