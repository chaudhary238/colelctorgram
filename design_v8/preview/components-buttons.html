<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--paper);
         font-family: var(--font-body); color: var(--ink); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
           letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; }
  .label b { color: var(--ink); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center;
         margin-bottom: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 8px;
         font-family: var(--font-body); font-weight: 600; line-height: 1;
         cursor: pointer; white-space: nowrap; }
  .primary  { background: var(--stamp-red); color: var(--paper); border: 1px solid var(--stamp-red); }
  .secondary{ background: var(--paper-soft); color: var(--ink); border: 1px solid var(--border-strong); }
  .ghost    { background: transparent; color: var(--ink); border: 1px solid transparent; }
  .dark     { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); }
  .grail    { background: var(--grail-gold); color: var(--ink);
              border: 1px solid var(--grail-gold-deep); box-shadow: var(--shadow-stamp); }
  .md { height: 44px; padding: 0 18px; font-size: 15px; border-radius: 12px; }
  .sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
  .lg { height: 52px; padding: 0 22px; font-size: 17px; border-radius: 14px; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
         min-width: 80px; }
</style></head>
<body>
  <div class="label"><b>Buttons</b> · 5 variants × 3 sizes</div>
  <div class="row"><span class="tok">primary</span>
    <button class="btn primary md">Make offer</button>
    <button class="btn primary sm">DM seller</button>
    <button class="btn primary lg">Confirm trade</button>
  </div>
  <div class="row"><span class="tok">secondary</span>
    <button class="btn secondary md">Save</button>
    <button class="btn secondary sm">Filter</button>
  </div>
  <div class="row"><span class="tok">dark</span>
    <button class="btn dark md">List item</button>
    <button class="btn dark sm">Post</button>
  </div>
  <div class="row"><span class="tok">grail</span>
    <button class="btn grail md">Notify me</button>
    <button class="btn grail sm">Reserve</button>
  </div>
  <div class="row"><span class="tok">ghost</span>
    <button class="btn ghost md">Cancel</button>
    <button class="btn ghost sm">Skip</button>
  </div>
</body></html>
