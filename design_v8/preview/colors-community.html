<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body { margin: 0; padding: 22px 28px 24px; background: var(--paper);
         font-family: var(--font-body); color: var(--ink); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
           letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px;
           display: flex; gap: 14px; }
  .label b { color: var(--ink); font-weight: 600; }
  .grid { display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; gap: 12px; }
  .sw { background: var(--swatch); border-radius: var(--r-md);
        padding: 12px; height: 108px;
        display: flex; flex-direction: column; justify-content: space-between;
        color: var(--swatch-fg); }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 15px;
          letter-spacing: -0.01em; }
  .hex  { font-family: var(--font-mono); font-size: 11px; opacity: 0.75;
          letter-spacing: 0.04em; }
  .tok  { font-family: var(--font-mono); font-size: 10px; opacity: 0.55;
          letter-spacing: 0.04em; }</style></head>
<body>
  <div class="label"><b>Forest & Plum</b><span>Success (completed trades) and community accents.</span></div>
  <div class="grid">
    <div class="sw" style="--swatch:#2D5F3F;--swatch-fg:#F4EFE6">
      <div><div class="name">Forest</div><div class="tok">--forest</div></div>
      <div class="hex">#2D5F3F</div>
    </div>
    <div class="sw" style="--swatch:#D2E0D3;--swatch-fg:#14110F">
      <div><div class="name">Forest Soft</div><div class="tok">--forest-soft</div></div>
      <div class="hex">#D2E0D3</div>
    </div>
    <div class="sw" style="--swatch:#6B3656;--swatch-fg:#F4EFE6">
      <div><div class="name">Plum</div><div class="tok">--plum</div></div>
      <div class="hex">#6B3656</div>
    </div>
    <div class="sw" style="--swatch:#E4D2DE;--swatch-fg:#14110F">
      <div><div class="name">Plum Soft</div><div class="tok">--plum-soft</div></div>
      <div class="hex">#E4D2DE</div>
    </div></div>
</body></html>
