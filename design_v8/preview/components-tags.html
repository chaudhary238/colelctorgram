<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px 28px; background: var(--paper);
         font-family: var(--font-body); color: var(--ink); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
           letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; }
  .label b { color: var(--ink); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 4px;
         padding: 3px 7px; border-radius: 4px; line-height: 1;
         font-family: var(--font-body); font-weight: 600; font-size: 10px;
         letter-spacing: 0.08em; text-transform: uppercase; }
  .sale  { background: var(--stamp-red);     color: var(--paper); }
  .po    { background: var(--grail-gold);    color: var(--ink); }
  .misb  { background: var(--ink);           color: var(--paper); }
  .sold  { background: var(--forest);        color: var(--paper); }
  .vouch { background: var(--verified-teal-soft); color: var(--verified-teal);
           border: 1px solid var(--verified-teal); }
  .event { background: var(--plum-soft);     color: var(--plum); border: 1px solid var(--plum); }
  .default { background: var(--bone);        color: var(--ink); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
         margin-top: 14px; }
</style></head>
<body>
  <div class="label"><b>Tags</b> · always uppercase · 10px · 0.08em tracking</div>
  <div class="row">
    <span class="tag sale">Sale</span>
    <span class="tag po">PO · Fri</span>
    <span class="tag misb">MISB</span>
    <span class="tag sold">Sold</span>
    <span class="tag vouch">Vouched</span>
    <span class="tag event">Event</span>
    <span class="tag default">In-hand</span>
  </div>
  <div class="tok">kinds: sale · po · misb · sold · vouch · event · default</div>
</body></html>
