<!-- @dsCard group="Labels" viewport="680x330" name="Tag, Badge, PostTypeTag & Stamp" subtitle="Status labels · post types · accent stamps" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px 26px; background: var(--paper); font-family: var(--font-body); color: var(--ink); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px; margin-top: 16px; }
  .label:first-child { margin-top: 0; }
  .label b { color: var(--ink); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  /* Tag */
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 5px; font-family: var(--font-body); font-weight: 600; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1; }
  /* Badge */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-family: var(--font-body); font-weight: 500; font-size: 11.5px; letter-spacing: 0.01em; white-space: nowrap; }
  /* PostTypeTag */
  .ptt { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 6px; font-family: var(--font-body); font-weight: 700; font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; white-space: nowrap; }
  /* Stamp */
  .stamp { background: var(--stamp-red); color: var(--paper); padding: 4px 8px; border-radius: 4px; font-family: var(--font-display); font-weight: 800; font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase; box-shadow: var(--shadow-stamp); display: inline-block; line-height: 1; }
</style></head>
<body>
  <div class="label"><b>Tag</b> · status labels</div>
  <div class="row">
    <span class="tag" style="background:var(--stamp-red);color:var(--paper)">For Sale</span>
    <span class="tag" style="background:var(--grail-gold);color:var(--ink)">Pre-order</span>
    <span class="tag" style="background:var(--ink);color:var(--paper)">MISB</span>
    <span class="tag" style="background:var(--forest);color:var(--paper)">Sold</span>
    <span class="tag" style="background:var(--grail-gold-soft);color:var(--grail-gold-deep);border:1px solid var(--grail-gold)">Reserved</span>
    <span class="tag" style="background:var(--verified-teal-soft);color:var(--verified-teal);border:1px solid var(--verified-teal)">Vouch</span>
    <span class="tag" style="background:var(--plum-soft);color:var(--plum);border:1px solid var(--plum)">Event</span>
  </div>
  <div class="label"><b>Badge</b> · inline labels</div>
  <div class="row">
    <span class="badge" style="background:var(--stamp-red);color:var(--paper)">Official</span>
    <span class="badge" style="background:var(--forest-soft);color:var(--forest)">Going</span>
    <span class="badge" style="background:var(--grail-gold-soft);color:var(--grail-gold-deep)">Interested</span>
    <span class="badge" style="background:var(--verified-teal-soft);color:var(--verified-teal)">Admin</span>
    <span class="badge" style="background:var(--plum-soft);color:var(--plum)">Private</span>
    <span class="badge" style="background:var(--stamp-red-soft);color:var(--stamp-red)">Just listed</span>
    <span class="badge" style="background:var(--ink);color:var(--paper)">Sold</span>
  </div>
  <div class="label"><b>PostTypeTag</b> · post classification</div>
  <div class="row">
    <span class="ptt" style="background:rgba(45,143,135,0.12);color:var(--verified-teal)">Showcase</span>
    <span class="ptt" style="background:rgba(107,54,86,0.12);color:var(--plum)">Discussion</span>
    <span class="ptt" style="background:rgba(196,132,32,0.12);color:var(--grail-gold-deep)">Review</span>
    <span class="ptt" style="background:rgba(255,36,66,0.10);color:var(--stamp-red)">Poll</span>
    <span class="ptt" style="background:rgba(176,119,36,0.13);color:#B07724">ISO</span>
    <span class="ptt" style="background:rgba(0,0,0,0.06);color:#999">Post</span>
  </div>
  <div class="label"><b>Stamp</b> · accent moments</div>
  <div class="row" style="align-items:flex-start;gap:12px">
    <span class="stamp" style="transform:rotate(2deg)">New Drop</span>
    <span class="stamp" style="background:var(--grail-gold);color:var(--ink);transform:rotate(-1deg)">Grail</span>
    <span class="stamp" style="background:var(--ink);transform:rotate(3deg)">MISB</span>
    <span class="stamp" style="background:var(--verified-teal);transform:rotate(-2deg)">Verified</span>
  </div>
</body></html>
