<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px 28px; background: var(--paper);
         font-family: var(--font-body); color: var(--ink); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
           letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; }
  .label b { color: var(--ink); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .ph { aspect-ratio: 1/1; border-radius: 10px; position: relative; overflow: hidden; }
  .ph::before { content: ""; position: absolute; inset: 0;
                background-image: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), transparent 60%);
                mix-blend-mode: soft-light; }
  .ph svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.32; }
  .ph .meta { position: absolute; bottom: 6px; left: 8px;
              color: rgba(244,239,230,0.7); font-family: var(--font-mono);
              font-size: 9px; letter-spacing: 0.05em; }
  .red    { background: linear-gradient(135deg,#B73B2E 0%, #842A24 100%); }
  .gold   { background: linear-gradient(135deg,#E8A33D 0%, #B07724 100%); }
  .teal   { background: linear-gradient(135deg,#3FA39B 0%, #1F6E68 100%); }
  .plum   { background: linear-gradient(135deg,#8B4870 0%, #4E2640 100%); }
  .forest { background: linear-gradient(135deg,#4A8E5F 0%, #234A30 100%); }
  .ink    { background: linear-gradient(135deg,#3A332E 0%, #14110F 100%); }
  .bone   { background: linear-gradient(135deg,#D6CDB9 0%, #B8AFA3 100%); }
  .tone { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint);
          text-align: center; margin-top: 5px; }
</style></head>
<body>
  <div class="label"><b>Product photo placeholders</b> · gradient + figure silhouette while the user has no real photo</div>
  <div class="grid">
    <div><div class="ph red"><svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMax meet"><ellipse cx="60" cy="84" rx="22" ry="3" fill="rgba(0,0,0,0.5)"/><path d="M60 22 q6 0 7 6 t-2 12 q4 4 4 14 l3 18 q1 8 -4 10 l-2 2 -3 -2 q-1 -8 -2 -14 l0 14 -3 4 -3 -4 0 -14 q-1 6 -2 14 l-3 2 -2 -2 q-5 -2 -4 -10 l3 -18 q0 -10 4 -14 q-3 -6 -2 -12 t7 -6 z" fill="rgba(0,0,0,0.55)"/></svg><span class="meta">MMS601</span></div><div class="tone">red</div></div>
    <div><div class="ph gold"><svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMax meet"><ellipse cx="60" cy="84" rx="22" ry="3" fill="rgba(0,0,0,0.5)"/><path d="M60 22 q6 0 7 6 t-2 12 q4 4 4 14 l3 18 q1 8 -4 10 l-2 2 -3 -2 q-1 -8 -2 -14 l0 14 -3 4 -3 -4 0 -14 q-1 6 -2 14 l-3 2 -2 -2 q-5 -2 -4 -10 l3 -18 q0 -10 4 -14 q-3 -6 -2 -12 t7 -6 z" fill="rgba(0,0,0,0.55)"/></svg></div><div class="tone">gold</div></div>
    <div><div class="ph teal"></div><div class="tone">teal</div></div>
    <div><div class="ph plum"></div><div class="tone">plum</div></div>
    <div><div class="ph forest"></div><div class="tone">forest</div></div>
    <div><div class="ph ink"></div><div class="tone">ink</div></div>
    <div><div class="ph bone"></div><div class="tone">bone</div></div>
  </div>
</body></html>
