<!-- @dsCard group="Type" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 32px; background: var(--paper);
         font-family: var(--font-body); color: var(--ink); }
  .specimen { font-family: var(--font-display); font-weight: 800;
              font-size: 72px; letter-spacing: -0.035em; line-height: 0.95;
              color: var(--ink); margin: 0 0 8px; }
  .row { display: flex; gap: 28px; align-items: baseline; flex-wrap: wrap; }
  .row span { font-family: var(--font-display); }
  .w400 { font-weight: 400; font-size: 26px; letter-spacing: -0.02em; }
  .w500 { font-weight: 500; font-size: 26px; letter-spacing: -0.02em; }
  .w600 { font-weight: 600; font-size: 26px; letter-spacing: -0.02em; }
  .w700 { font-weight: 700; font-size: 26px; letter-spacing: -0.02em; }
  .w800 { font-weight: 800; font-size: 26px; letter-spacing: -0.025em; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
           letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px;
           display: flex; gap: 16px; }
  .label b { color: var(--ink); font-weight: 600; }
</style></head>
<body>
  <div class="label">
    <b>Bricolage Grotesque</b>
    <span>Display · headlines · brand</span>
    <span>--font-display</span>
  </div>
  <div class="specimen">Grail-only.</div>
  <div class="row">
    <span class="w400">Aa 400</span>
    <span class="w500">Aa 500</span>
    <span class="w600">Aa 600</span>
    <span class="w700">Aa 700</span>
    <span class="w800">Aa 800</span>
  </div>
</body></html>
