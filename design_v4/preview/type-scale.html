<!-- @dsCard group="Type" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 32px; background: var(--paper);
         font-family: var(--font-body); color: var(--ink); }
  .row { display: grid; grid-template-columns: 100px 1fr 100px;
         align-items: baseline; gap: 16px; padding: 6px 0;
         border-bottom: 1px dashed var(--border); }
  .row:last-child { border-bottom: none; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint);
         letter-spacing: 0.04em; }
  .px  { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint);
         text-align: right; }
  .s   { font-family: var(--font-display); color: var(--ink); letter-spacing: -0.025em;
         line-height: 1; }
  .xl  { font-size: 48px; font-weight: 800; letter-spacing: -0.035em; }
  .lg  { font-size: 36px; font-weight: 700; }
  .md  { font-size: 28px; font-weight: 700; }
  .sm  { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .title { font-size: 18px; font-weight: 600; font-family: var(--font-body); letter-spacing: -0.01em; }
  .body  { font-size: 15px; font-weight: 400; font-family: var(--font-body); letter-spacing: 0; }
</style></head>
<body>
  <div class="row"><span class="tok">display-xl</span><span class="s xl">Grails</span><span class="px">56 / 700</span></div>
  <div class="row"><span class="tok">display-lg</span><span class="s lg">In-hand &amp; MISB</span><span class="px">44 / 700</span></div>
  <div class="row"><span class="tok">display-md</span><span class="s md">Mumbai Meet Vol 4</span><span class="px">34 / 700</span></div>
  <div class="row"><span class="tok">display-sm</span><span class="s sm">Hot Toys MMS601</span><span class="px">28 / 700</span></div>
  <div class="row"><span class="tok">title</span><span class="s title">Card title</span><span class="px">22 / 600</span></div>
  <div class="row"><span class="tok">body</span><span class="s body">Default UI body, 15px.</span><span class="px">15 / 400</span></div>
</body></html>
