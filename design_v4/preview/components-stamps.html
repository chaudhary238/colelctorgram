<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 26px 28px; background: var(--paper);
         font-family: var(--font-body); color: var(--ink); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
           letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 22px; }
  .label b { color: var(--ink); font-weight: 600; }
  .row { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .stamp { background: var(--bg-color, var(--stamp-red)); color: var(--paper);
           padding: 5px 9px; border-radius: 4px;
           font-family: var(--font-display); font-weight: 800;
           font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase;
           box-shadow: var(--shadow-stamp); line-height: 1; white-space: nowrap;
           display: inline-block; transform: rotate(var(--r, 2deg)); }
  .gold  { --bg-color: var(--grail-gold); color: var(--ink); }
  .ink   { --bg-color: var(--ink); }
  .plum  { --bg-color: var(--plum); }
  .teal  { --bg-color: var(--verified-teal); }
</style></head>
<body>
  <div class="label"><b>Stamp accents</b> · always rotated · hard 2px ink shadow · uppercase display</div>
  <div class="row">
    <span class="stamp">MISB</span>
    <span class="stamp gold" style="--r:-3deg">Grail</span>
    <span class="stamp ink" style="--r:4deg">In-hand</span>
    <span class="stamp plum" style="--r:-2deg">Event</span>
    <span class="stamp teal" style="--r:5deg">Vouched</span>
  </div>
</body></html>
