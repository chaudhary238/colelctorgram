<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="colors_and_type.css">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1280px;height:854px;overflow:hidden}
.wrap{display:flex;width:1280px;height:854px}
.main{flex:1;background:var(--stamp-red);display:flex;align-items:center;justify-content:center}
.name{font-family:var(--font-display,'Geist',system-ui,sans-serif);font-weight:900;font-size:170px;letter-spacing:-0.03em;color:#fff}
.strip{width:110px;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head>
<body>
<div class="wrap">
  <div class="main"><div class="name">Scorred</div></div>
  <div class="strip">
    <div style="background:#F2A33D"></div>
    <div style="background:#2D8F87"></div>
    <div style="background:#6B3656"></div>
    <div style="background:#1A1A1A"></div>
  </div>
</div>
</body></html>
