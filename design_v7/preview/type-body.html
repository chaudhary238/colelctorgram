<!-- @dsCard group="Type" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 32px; background: var(--paper);
         font-family: var(--font-body); color: var(--ink); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
           letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px;
           display: flex; gap: 16px; }
  .label b { color: var(--ink); font-weight: 600; }
  .lede { font-family: var(--font-body); font-weight: 400; font-size: 18px;
          line-height: 1.5; color: var(--ink); max-width: 560px; margin: 0 0 14px; }
  .lede em { color: var(--ink-mute); font-style: normal; }
  .row { display: flex; gap: 22px; align-items: baseline; flex-wrap: wrap; }
  .row span { font-family: var(--font-body); font-size: 22px; }
  .w300 { font-weight: 300; }
  .w400 { font-weight: 400; }
  .w500 { font-weight: 500; }
  .w600 { font-weight: 600; }
  .w700 { font-weight: 700; }
</style></head>
<body>
  <div class="label">
    <b>Geist</b>
    <span>Body · UI · captions</span>
    <span>--font-body</span>
  </div>
  <div class="lede">
    Hot Toys MMS601, single owner, never displayed.
    <em>Trades considered for grail Sideshow pieces — DM if interested.</em>
  </div>
  <div class="row">
    <span class="w300">Aa 300</span>
    <span class="w400">Aa 400</span>
    <span class="w500">Aa 500</span>
    <span class="w600">Aa 600</span>
    <span class="w700">Aa 700</span>
  </div>
</body></html>
