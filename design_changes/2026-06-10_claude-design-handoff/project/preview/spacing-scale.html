<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px 28px; background: var(--paper);
         font-family: var(--font-body); color: var(--ink); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
           letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; }
  .label b { color: var(--ink); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 14px; padding: 5px 0; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute);
         width: 56px; }
  .bar { background: var(--stamp-red); height: 14px; border-radius: 2px; }
  .px  { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
</style></head>
<body>
  <div class="label"><b>Spacing scale</b> · 4-pt grid · use --s-{n}</div>
  <div class="row"><span class="tok">--s-1</span><span class="bar" style="width:4px"></span><span class="px">4px</span></div>
  <div class="row"><span class="tok">--s-2</span><span class="bar" style="width:8px"></span><span class="px">8px</span></div>
  <div class="row"><span class="tok">--s-3</span><span class="bar" style="width:12px"></span><span class="px">12px</span></div>
  <div class="row"><span class="tok">--s-4</span><span class="bar" style="width:16px"></span><span class="px">16px</span></div>
  <div class="row"><span class="tok">--s-5</span><span class="bar" style="width:20px"></span><span class="px">20px</span></div>
  <div class="row"><span class="tok">--s-6</span><span class="bar" style="width:24px"></span><span class="px">24px</span></div>
  <div class="row"><span class="tok">--s-8</span><span class="bar" style="width:32px"></span><span class="px">32px</span></div>
  <div class="row"><span class="tok">--s-10</span><span class="bar" style="width:40px"></span><span class="px">40px</span></div>
  <div class="row"><span class="tok">--s-12</span><span class="bar" style="width:48px"></span><span class="px">48px</span></div>
  <div class="row"><span class="tok">--s-16</span><span class="bar" style="width:64px"></span><span class="px">64px</span></div>
</body></html>
