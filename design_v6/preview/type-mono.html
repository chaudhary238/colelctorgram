<!-- @dsCard group="Type" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 32px; background: var(--paper);
         font-family: var(--font-body); color: var(--ink); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
           letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px;
           display: flex; gap: 16px; }
  .label b { color: var(--ink); font-weight: 600; }
  .money-row { display: flex; gap: 28px; align-items: baseline; margin-bottom: 14px; }
  .price { font-family: var(--font-mono); font-weight: 600; font-size: 36px;
           color: var(--ink); font-variant-numeric: tabular-nums; }
  .strike { font-family: var(--font-mono); font-size: 18px; color: var(--ink-faint);
            text-decoration: line-through; font-variant-numeric: tabular-nums; }
  .sku-row { display: flex; gap: 16px; font-family: var(--font-mono);
             font-size: 13px; color: var(--ink-mute); }
  .sku-row span { background: var(--bone); border: 1px solid var(--border);
                  border-radius: 4px; padding: 4px 10px; letter-spacing: 0.04em; }
</style></head>
<body>
  <div class="label">
    <b>JetBrains Mono</b>
    <span>Prices · SKUs · codes</span>
    <span>--font-mono · tabular-nums</span>
  </div>
  <div class="money-row">
    <span class="price">₹ 18,400</span>
    <span class="strike">₹ 22,000</span>
  </div>
  <div class="sku-row">
    <span>MMS601</span>
    <span>1/6 SCALE</span>
    <span>MISB</span>
    <span>2022</span>
  </div>
</body></html>
