<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--paper);
         font-family: var(--font-body); color: var(--ink); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
           letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; }
  .label b { color: var(--ink); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 64px; height: 64px; background: var(--bone-deep);
         border: 1px solid var(--border-strong); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--ink); }
  .px  { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); }
</style></head>
<body>
  <div class="label"><b>Border radii</b> · cards = md · sheets = lg · modals = xl</div>
  <div class="grid">
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="tok">--r-xs</div><div class="px">4px</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="tok">--r-sm</div><div class="px">8px</div></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><div class="tok">--r-md</div><div class="px">12px</div></div>
    <div class="item"><div class="box" style="border-radius:18px"></div><div class="tok">--r-lg</div><div class="px">18px</div></div>
    <div class="item"><div class="box" style="border-radius:28px"></div><div class="tok">--r-xl</div><div class="px">28px</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="tok">--r-pill</div><div class="px">999px</div></div>
  </div>
</body></html>
