<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px 28px; background: var(--paper);
         font-family: var(--font-body); color: var(--ink); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
           letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; }
  .label b { color: var(--ink); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 10px; }
  .ico { width: 36px; height: 36px; border-radius: 10px;
         background: transparent; color: var(--ink);
         border: 1px solid var(--border);
         display: flex; align-items: center; justify-content: center;
         cursor: pointer; }
  .active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .ico svg { stroke: currentColor; fill: none; stroke-width: 1.75;
             stroke-linecap: round; stroke-linejoin: round; }
  .name { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint);
          text-align: center; margin-top: 4px; letter-spacing: 0.04em; }
</style></head>
<body>
  <div class="label"><b>Icon button</b> · 36×36 · 10px radius · Lucide outline · 1.75 stroke</div>
  <div class="grid">
    <div><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M3 9 12 2l9 7v11a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2z"/></svg></div><div class="name">home</div></div>
    <div><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div><div class="name">bag</div></div>
    <div><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m22 11-3 3-2-2"/></svg></div><div class="name">vouch</div></div>
    <div><div class="ico"><circle cx="12" cy="8" r="5"/><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M3 21a9 9 0 0 1 18 0"/></svg></div><div class="name">user</div></div>
    <div><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div><div class="name">search</div></div>
    <div><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></div><div class="name">bell</div></div>
    <div><div class="ico active"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg></div><div class="name">plus</div></div>
    <div><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><div class="name">heart</div></div>
    <div><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><div class="name">message</div></div>
    <div><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></div><div class="name">shield</div></div>
    <div><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></div><div class="name">trend</div></div>
  </div>
</body></html>
