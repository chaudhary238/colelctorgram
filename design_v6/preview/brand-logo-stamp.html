<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bone);
         font-family: var(--font-body); color: var(--ink); }
  .row { display: flex; align-items: center; gap: 32px; }
  .seal-card {
    width: 140px; height: 140px; background: var(--paper-soft);
    border: 1px solid var(--border); border-radius: var(--r-md);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-1);
  }
  .seal-card img { width: 96px; height: 96px; }
  .meta { display: flex; flex-direction: column; gap: 6px; }
  .h { font-family: var(--font-display); font-weight: 700; font-size: 22px;
       color: var(--ink); letter-spacing: -0.02em; }
  .sub { font-size: 13px; color: var(--ink-mute); max-width: 320px; line-height: 1.5; }
  .meta .mono { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint);
                letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; }
</style></head>
<body>
  <div class="row">
    <div class="seal-card">
      <img src="../assets/logo-stamp.svg" alt="CollectorHub stamp seal">
    </div>
    <div class="meta">
      <div class="mono">PRIMARY MARK · LOGO-STAMP.SVG</div>
      <div class="h">The C-stamp seal</div>
      <div class="sub">Hand-stamped passport mark. Always rotated −4° to feel inked-not-printed. Stamp red on cream, paper letterform inside a dashed inner frame.</div>
    </div>
  </div>
</body></html>
