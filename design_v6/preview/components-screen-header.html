<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px 28px; background: var(--bone);
         font-family: var(--font-body); color: var(--ink); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
           letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; }
  .label b { color: var(--ink); font-weight: 600; }
  .frame { background: var(--paper); border: 1px solid var(--border);
           border-radius: var(--r-md); overflow: hidden;
           box-shadow: var(--shadow-1); max-width: 440px; }
  .hdr { padding: 12px 20px 14px; border-bottom: 1px solid var(--border);
         display: flex; align-items: center; gap: 12px; min-height: 56px; }
  .lead { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
          display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .lead svg { stroke: var(--ink); fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .titles { flex: 1; }
  .t { font-family: var(--font-display); font-weight: 700; font-size: 24px;
       letter-spacing: -0.025em; line-height: 1.1; color: var(--ink); }
  .s { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
  .trail { display: flex; gap: 8px; }
  .ico { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
         display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .ico svg { stroke: var(--ink); fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body>
  <div class="label"><b>Screen header</b> · leading + title + subtitle + trailing icons</div>
  <div class="frame">
    <div class="hdr">
      <div class="lead"><svg width="20" height="20" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></div>
      <div class="titles">
        <div class="t">Hot Toys MMS601</div>
        <div class="s">Listed by @aman_toys · Mumbai · 3h ago</div>
      </div>
      <div class="trail">
        <div class="ico"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
        <div class="ico"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98"/><path d="m15.41 6.51-6.82 3.98"/></svg></div>
      </div>
    </div>
  </div>
</body></html>
