<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--bone);
         font-family: var(--font-body); color: var(--ink); }
  .wrap { background: var(--paper-soft); border: 1px solid var(--border);
          border-radius: var(--r-md); padding: 28px 32px;
          display: flex; flex-direction: column; gap: 18px;
          box-shadow: var(--shadow-1); }
  .lockup img { display: block; height: 64px; }
  .meta { font-size: 12px; color: var(--ink-faint);
          font-family: var(--font-mono); letter-spacing: 0.06em;
          display: flex; gap: 24px; text-transform: uppercase; }
  .meta b { color: var(--ink); font-weight: 600; }
</style></head>
<body>
  <div class="wrap">
    <div class="lockup">
      <img src="../assets/logo-wordmark.svg" alt="CollectorHub wordmark">
    </div>
    <div class="meta">
      <span><b>Wordmark</b> Bricolage 700 · −0.6 tracking</span>
      <span><b>Seal</b> rotate −4°</span>
      <span><b>Gap</b> 16px</span>
    </div>
  </div>
</body></html>
